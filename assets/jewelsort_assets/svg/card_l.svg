<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 336" width="540" height="336">
  <defs>
    <linearGradient id="papercard_l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6EEDC"/>
    </linearGradient>
    <linearGradient id="framecard_l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0904"/>
      <stop offset="100%" stop-color="#1a1108"/>
    </linearGradient>
    <filter id="cardShadowcard_l" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#cardShadowcard_l)">
    <!-- Paper card -->
    <rect x="10" y="10" width="520" height="316" rx="7" fill="url(#papercard_l)"/>
    <!-- Top-edge highlight on paper -->
    <rect x="14" y="13" width="512" height="2" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <!-- Inset frame for pixel art -->
    <rect x="40" y="22" width="460" height="264" rx="4" fill="url(#framecard_l)"/>
    <!-- Top inner shadow on frame -->
    <rect x="40" y="22" width="460" height="2" fill="#000" opacity="0.45"/>
  </g>
</svg>
