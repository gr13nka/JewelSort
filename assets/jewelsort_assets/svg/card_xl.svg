<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640">
  <defs>
    <linearGradient id="papercard_xl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6EEDC"/>
    </linearGradient>
    <linearGradient id="framecard_xl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0904"/>
      <stop offset="100%" stop-color="#1a1108"/>
    </linearGradient>
    <filter id="cardShadowcard_xl" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="goldCornercard_xl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1CB6E"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
  </defs>
  <g filter="url(#cardShadowcard_xl)">
    <!-- Paper card -->
    <rect x="14" y="14" width="532" height="612" rx="7" fill="url(#papercard_xl)"/>
    <!-- Top-edge highlight on paper -->
    <rect x="18" y="17" width="524" height="2" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <!-- Inset frame for pixel art -->
    <rect x="36" y="36" width="488" height="488" rx="4" fill="url(#framecard_xl)"/>
    <!-- Top inner shadow on frame -->
    <rect x="36" y="36" width="488" height="2" fill="#000" opacity="0.45"/>
  </g>
  <!-- Top-left bracket -->
  <path d="M 26 26 L 54 26 L 54 32 L 32 32 L 32 54 L 26 54 Z" fill="url(#goldCornercard_xl)" stroke="#6a4f15" stroke-width="0.5"/>
  <!-- Top-right bracket -->
  <path d="M 534 26 L 506 26 L 506 32 L 528 32 L 528 54 L 534 54 Z" fill="url(#goldCornercard_xl)" stroke="#6a4f15" stroke-width="0.5"/>
  <!-- Bottom-left bracket -->
  <path d="M 26 614 L 54 614 L 54 608 L 32 608 L 32 586 L 26 586 Z" fill="url(#goldCornercard_xl)" stroke="#6a4f15" stroke-width="0.5"/>
  <!-- Bottom-right bracket -->
  <path d="M 534 614 L 506 614 L 506 608 L 528 608 L 528 586 L 534 586 Z" fill="url(#goldCornercard_xl)" stroke="#6a4f15" stroke-width="0.5"/>

</svg>
