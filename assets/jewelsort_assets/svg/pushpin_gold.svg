<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <defs>
    <radialGradient id="pingold" cx="35%" cy="30%" r="0.6">
      <stop offset="0%" stop-color="#FFE090"/>
      <stop offset="60%" stop-color="#D4A845"/>
      <stop offset="100%" stop-color="#6a4f15"/>
    </radialGradient>
    <filter id="pinShadowgold" x="-15%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#pinShadowgold)">
    <circle cx="22" cy="22" r="18" fill="url(#pingold)"/>
    <!-- inner rim shadow -->
    <circle cx="22" cy="22" r="18" fill="none" stroke="#6a4f15" stroke-width="1.5" opacity="0.5"/>
    <!-- top sparkle -->
    <ellipse cx="15" cy="14" rx="5.5" ry="3.5" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="14" cy="13" rx="2" ry="1.4" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
